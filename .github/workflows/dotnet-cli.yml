name: .NET CLI Build

on:
  push:
    branches: [ "CLI" ]
  pull_request:
    branches: [ "CLI" ]

jobs:
  build:
    name: Build (${{ matrix.configuration }})
    runs-on: windows-latest
    strategy:
      matrix:
        configuration: [Debug, Release]

    env:
      PROJECT_PATH: GitAutoUpdater.csproj

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore dependencies
        run: dotnet restore "$PROJECT_PATH"

      - name: Build project
        run: dotnet build "$PROJECT_PATH" --configuration "${{ matrix.configuration }}" --no-restore