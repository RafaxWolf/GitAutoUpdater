name: .NET Build

on:
  push:
    branches: [ "Desktop" ]
  pull_request:
    branches: [ "Desktop" ]

jobs:
  build:
    strategy:
      matrix:
        configuration: [Debug, Release]

    runs-on: windows-latest

    env:
      Project_Path: GitAutoUpdater.csproj

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore dependencies
        run: dotnet restore $env:Project_Path

      - name: Build project
        run: dotnet build $env:Project_Path --configuration ${{ matrix.configuration }} --no-restore

      - name: Run tests
        run: dotnet test $env:Project_Path --configuration ${{ matrix.configuration }} --no-build --logger "trx;LogFileName=test-results.trx"
